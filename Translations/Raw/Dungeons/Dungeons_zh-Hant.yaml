    m_Code: zh-Hant
  m_SharedData: {fileID: 11400000, guid: 9d3c47f862a53f74690dd26349005e02, type: 2}
  m_Metadata:
    m_Items:
    - rid: 1186001538324365349
  m_TableData:
  - m_Id: 11823947247616
    m_Localized: '{GlobalKeywords.Village}'
    m_Metadata:
      m_Items:
      - rid: 1186001538324365349
  - m_Id: 11824022745088
    m_Localized: 戈頓村，一個寧靜、與世隔絕的地方。大家可別被村壯寧靜的景致給騙了。這裡啊，可是英雄與女傑的聚集地喔！更是各路冒險者踏上冒險旅程的起點！
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745089
    m_Localized: 瘋狂森林
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745090
    m_Localized: 這裡曾經是欣欣向榮的自然庇護所，如今，卻成了邪惡聚集的溫床。據說，萬惡的根源是一位吸血鬼，但我們卻只尋得混亂的場面以及烤雞。
    m_Metadata:
      m_Items: []
  - m_Id: 12266632501878784
    m_Localized: 狂怒森林
    m_Metadata:
      m_Items: []
  - m_Id: 12266632527044608
    m_Localized: 越是進到森林深處，怪物們也就變得越加狂躁。一定是空氣中的某種成份快把牠們逼瘋了，也許是黑暗魔法的關係，又或者是烤雞的品質欠佳，嗎？
    m_Metadata:
      m_Items: []
  - m_Id: 12266632527044609
    m_Localized: 狂暴之林
    m_Metadata:
      m_Items: []
  - m_Id: 12266632527044610
    m_Localized: 在你踏進了狂暴之林後，你就無法再回頭了。樹林間傳來了微弱的哭喊聲，伴隨著成千上萬種翅膀拍動的聲響。
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745091
    m_Localized: 錦鈿書庫
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745092
    m_Localized: 徒然學士受詛咒，知曉一切卻不解世事。他那無盡的書庫將賜予我們啟示……還是災厄？其中有具石面具，不斷發出呢喃低語。
    m_Metadata:
      m_Items: []
  - m_Id: 40868002012160000
    m_Localized: 書庫（西廂）
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714432
    m_Localized: 在這座由書架與詛咒書卷構成的迷宮裡，神智正常的入侵者絕不敢高聲喧譁。非人的身影穿梭長廊，只為遲來的復仇。
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714433
    m_Localized: 書庫（聖所）
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714434
    m_Localized: 這裡曾匯聚了全世界最聰明、最有才華的法師。如今，這個地方已淪為黑暗魔法、邪惡魔僕以及那些試圖掌控黑暗之人的庇護之所。
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745093
    m_Localized: 乳製品工廠
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745094
    m_Localized: 現在，牛奶魔法的誕生地充斥著混沌。在這裡，會凝固的東西可不只有血液喔。在這座崩壞的工廠裡，有張秘密地圖正盼望著一位勇敢的英雄來拯救它。
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714435
    m_Localized: 牛奶工廠
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714436
    m_Localized: 昔日貪腐的官員總愛從乳廠撈油水、中飽私囊。如今這裡只剩迷宮般的管線，與淪為夢魘的巨大守護魔像。
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714437
    m_Localized: 煉乳廠
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714438
    m_Localized: 乳製品工業區的核心，不少乳臭未乾的冒險者在此迷失了方向。當心嗜奶成痴的野獸，還有最原始的生乳魔法。
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745095
    m_Localized: 擎天塔
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745096
    m_Localized: 科學與巫術交會之處，人們打著進步的旗號，卻催生出種種恐怖。這裡無數的器皿與實驗，或許藏著我們尋覓的答案。
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745097
    m_Localized: 大教堂
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745098
    m_Localized: 那些位高權重卻卑躬屈膝的人，都逃不過被欺騙的命運。在這個墮落沉淪的聖地尋找吸血鬼，可說是再適合不過了。應該吧。
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714439
    m_Localized: 終極大教堂
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714440
    m_Localized: 懸空的王座廳就在此處，這片土地的一切苦難，都由其中的黑手在幕後牽線。自詡為神卻耽溺腐朽的傢伙，正該住這種地方。
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401281
    m_Localized: 迷你橋
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401282
    m_Localized: 一眼看過去，我們應該可以安全通過這座別緻的迷你橋，吧。無論如何，只要有橋能走，肯定都比游泳過河好。
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401283
    m_Localized: 超迷你橋
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401284
    m_Localized: 這座橋似乎比前一座橋還要更小、更恬靜。這次我們肯定能平安無事地過橋了吧。
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401285
    m_Localized: 惡意橋
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401286
    m_Localized: 一座看似無害，名字卻很嚇人的橋。啊呀，走這座橋肯定不會出事的！安啦！
    m_Metadata:
      m_Items: []
  - m_Id: 195993120258600960
    m_Localized: 昇月城
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738304
    m_Localized: 昇月城（序章）
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738305
    m_Localized: 在月光閃爍的海平面之下，似乎有著一股不安躁動著的暗潮洶湧⋯⋯
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738306
    m_Localized: 月下謎團
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738307
    m_Localized: 沉沒密室
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738308
    m_Localized: 在一波又一波的浪潮下，究竟藏著什麼樣的秘密呢？是一場與 NPC 的邂逅，還是製作團隊爆肝趕出來的未來內容藍圖呢？
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738309
    m_Localized: 有位陌生人於海底靜靜地等候著，期待在潮退之時，能夠與最勇敢的冒險者相會⋯不過啊，畢竟是海底嘛，所以可別忘了要多帶幾條毛巾喔～
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738310
    m_Localized: 昇月城
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738311
    m_Localized: 據他人所言，當年迎來了滿月，而大海也就於轉瞬之間吞噬了這座城市⋯感覺這裡深藏著某種未知的奧祕，是不是該該去一探究竟啦，各位？
    m_Metadata:
      m_Items: []
