  m_SharedData: {fileID: 11400000, guid: 9d3c47f862a53f74690dd26349005e02, type: 2}
  m_Metadata:
    m_Items:
    - rid: 1186001538324365337
  m_TableData:
  - m_Id: 11823947247616
    m_Localized: '{GlobalKeywords.Village}'
    m_Metadata:
      m_Items:
      - rid: 1186001538324365337
  - m_Id: 11824022745088
    m_Localized: "一見のどかで田舎っぽいゴートン村。\nだが、その静寂の裏には、数多の英雄と冒険者の交差点が、そこにある！冒険者たちの終着点だ。"
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745089
    m_Localized: 狂乱の森
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745090
    m_Localized: かつては繫栄する救いの場が、今では悪の廃棄場に。これはヴァンパイアの所業と言われているが、ここにあるのは混沌とローストチキンだけだ。
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745091
    m_Localized: 象眼の図書館
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745092
    m_Localized: 無能な書記は全知であり、物事を一切理解していない。彼の無限の図書館がもたらすは、果たして知識か破滅か。答えは、内に潜む石の仮面と共にある。
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745093
    m_Localized: 酪農場
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745094
    m_Localized: 混沌渦巻くミルク・マジック発祥の地。ここで凝固するのは、血のみにあらず。荒廃した工場に挑む勇敢な者には、濃厚なサプライズが待っている。
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745095
    m_Localized: ガロの塔
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745096
    m_Localized: ここは進歩の名のもとに、科学と魔術で恐るべきものが生み出された施設。そこに残る多くの遺物や実験の産物を辿れば、目的のものが見つかるはず。
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745097
    m_Localized: マグナ礼拝堂
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745098
    m_Localized: 比類なき高みにあった国家が、ここまで転落した理由とは？この堕落しきった不純の土地なら、ヴァンパイアだってきっと見つかるはず。…たぶん。
    m_Metadata:
      m_Items: []
  - m_Id: 12266632501878784
    m_Localized: 憤怒の森
    m_Metadata:
      m_Items: []
  - m_Id: 12266632527044608
    m_Localized: 森の奥へ進むほど、魔物たちは狂気に侵されていく。漂う空気に混じる何かが原因のようだ。闇魔法か、あるいは質の悪いチキンか…
    m_Metadata:
      m_Items: []
  - m_Id: 12266632527044609
    m_Localized: 狂乱の森
    m_Metadata:
      m_Items: []
  - m_Id: 12266632527044610
    m_Localized: その奥底に踏み入れば、帰路はない。木々のざわめきの中、微かに混じる叫び声、そして幾千もの羽音が響いている。
    m_Metadata:
      m_Items: []
  - m_Id: 40868002012160000
    m_Localized: 図書館：西棟
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714432
    m_Localized: 呪われた書物で溢れる書庫。この不気味な迷宮では、声を潜めねば命取りだ。館内を彷徨う人外が、長年の復讐を成就させようと獲物を探している。
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714433
    m_Localized: 図書館：聖域
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714434
    m_Localized: かつては、世界最高峰の賢者たちが集い、知と魔法の極致を追い求めた聖域。しかし今や残るは、闇の魔術と邪悪な使い魔、そして術者のみだ。
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714435
    m_Localized: ミルク製造工場
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714436
    m_Localized: かつてこの地では、強欲な権力者たちが私腹を肥やしていた。しかし今では配管だらけの迷宮と、守護ゴーレムたちの成れの果てしか存在しない。
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714437
    m_Localized: 凝乳精製所
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714438
    m_Localized: ここは乳業工業複合体の中枢。“軽率な冒険者”たちが骨も残さず搾り尽くされた場所。ミルクに魅入られた怪物、そして未加工の乳白魔法にご用心。
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714439
    m_Localized: ウルティマ礼拝堂
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714440
    m_Localized: ここに浮かぶは王座の間。この地の災いを裏から操る黒幕たちの根城でもある。腐敗にまみれ神を気取る者どもには、お似合いの場所だ。
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401281
    m_Localized: ミニ橋
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401282
    m_Localized: この小さいながらも立派な橋は、安全性も完璧なようだ。なにせ、泳ぐよりは渡る方が断然マシなのだから。
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401283
    m_Localized: マクロ橋
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401284
    m_Localized: この橋は前回のものよりもさらに小さい。安全に、何事もなく渡りたいならこの橋で間違いないだろう。
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401285
    m_Localized: いじわる橋
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401286
    m_Localized: その名とは裏腹に無害そうな橋。きっと渡っても何ら問題はない…よね？
    m_Metadata:
      m_Items: []
  - m_Id: 195993120258600960
    m_Localized: ムーンゴロウ
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738310
    m_Localized: ムーンゴロウ
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738304
    m_Localized: ムーンゴロウ プロローグ
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738305
    m_Localized: 月光に照らされたこの海の下で、何かが待ち構えている……
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738306
    m_Localized: 月明かりの謎
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738307
    m_Localized: 沈んだ部屋
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738308
    m_Localized: 波の奥にあるものとは……単なるNPCとの遭遇なのか、それともコンテンツを急いで用意したプレビューなだけ？
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738309
    m_Localized: 満ち引きする潮の下で、見知らぬ何者かが最も勇敢なクロウラーたちを待っている。ただ、びしょ濡れになるので、タオルを忘れずに持って行こう。
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738311
    m_Localized: 伝説によると、ある都市が満月の無情な監視の下、海に飲み込まれた。未知の謎が潜むその街、城壁の向こうに何があるのか、確かめるべきだろう。
    m_Metadata:
      m_Items: []
