    - rid: 4841317357165477904
  m_TableData:
  - m_Id: 11823947247616
    m_Localized: '{GlobalKeywords.Village}'
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745088
    m_Localized: '고튼 마을은 번화한 곳에서 떨어져 한적하고 촌스러운 동네입니다. 평온한 겉모습에 속지 마세요. 이곳은 용광로나 다름 없으니까요! '
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745089
    m_Localized: 광기의 숲
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745090
    m_Localized: 한때 부상하던 안식처였지만 지금은 악의 소굴입니다. 악의 근원은 뱀파이어라지만 대혼란 속에서 구운 닭고기를 얻을 수 있으니 횡재죠.
    m_Metadata:
      m_Items: []
  - m_Id: 12266632501878784
    m_Localized: 분노의 숲
    m_Metadata:
      m_Items: []
  - m_Id: 12266632527044608
    m_Localized: 깊은 숲으로 들어갈수록 괴물들은 더 불안합니다. 무언가가 광기를 만드는 것 같아요. 흑마술일지, 아니면 닭고기 육질일지 모르죠.
    m_Metadata:
      m_Items: []
  - m_Id: 12266632527044609
    m_Localized: 광폭의 숲
    m_Metadata:
      m_Items: []
  - m_Id: 12266632527044610
    m_Localized: 한번 들어가면 심연에서 되돌아 나올 수 없습니다. 숨죽여 흐느끼는 소리와 천 개의 날개가 퍼드득대는 소리가 뒤섞여 들립니다.
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745091
    m_Localized: 화려한 도서관
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745092
    m_Localized: 저주받은 필경사가 모든 것을 알지만 이해하지 못합니다. 도서관에서는 통찰력을 얻을 수도 저주를 받을 수도 있죠. 돌가면이 속삭입니다.
    m_Metadata:
      m_Items: []
  - m_Id: 40868002012160000
    m_Localized: 도서관 서관
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714432
    m_Localized: 이 도서관의 미로 속에서 제정신이라면 큰소리로 말할 엄두를 내지 못할 거예요. 인간의 형상이 아닌 놈들이 복수를 노리고 있으니까요.
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714433
    m_Localized: 도서관 성소
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714434
    m_Localized: 한때 총명하고 재능 있는 마법사들의 고향이었지만, 이제는 어둠의 마법과 사악한 하수인들, 그리고 그것들을 지배하려는 자들뿐이죠.
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745093
    m_Localized: 유제품 공장
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745094
    m_Localized: 우유 마법의 발상지가 혼돈에 휩싸입니다. 여기서 응고되는 것은 피만이 아닙니다. 전복된 공장에서 비밀 지도가 기다리고 있으니까요.
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714435
    m_Localized: 우유 공장
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714436
    m_Localized: 과거에는 부패한 관리들이 세금을 횡령하곤 했습니다. 이제 남은 것은 한때 이곳을 지켰던 거대한 골렘들이 배회하는 파이프 미로뿐이죠.
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714437
    m_Localized: 커드 정제소
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714438
    m_Localized: 유제품 산업 단지의 중심지이자, 모험가들이 수없이 자기 ‘유청’을 잃었던 곳입니다. 미친 짐승들과 생짜 우유 마법을 조심하세요.
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745095
    m_Localized: 갈로의 탑
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745096
    m_Localized: 진보라는 이름으로 공포를 실현한 과학과 마법의 건축물입니다. 유물을 조사하고 실험을 하면 원하는 것을 찾을 수 있을지도 모릅니다.
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745097
    m_Localized: 마그나 예배당
    m_Metadata:
      m_Items: []
  - m_Id: 11824022745098
    m_Localized: 그들은 지나치게 군림하며 지나치게 비열했습니다. 타락한 순수성의 연결 고리라면 누구나 뱀파이어를 찾을 수 있을 거예요. 아마도요.
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714439
    m_Localized: 울티마 예배당
    m_Metadata:
      m_Items: []
  - m_Id: 40868002045714440
    m_Localized: 떠 있는 왕좌의 방이 있습니다. 이 땅의 꼭두각시의 달인들이 줄을 늘어뜨고 있죠. 스스로 신이라 여기며 부패한 자들에게 딱 어울리죠.
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401281
    m_Localized: 소소한 다리
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401282
    m_Localized: 이 아담하고 멋진 다리는 건너도 정말 안전할 것 같습니다. 어쨌든 수영보다야 훨씬 나아요.
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401283
    m_Localized: 미미한 다리
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401284
    m_Localized: 이 다리는 이전 다리보다 훨씬 더 작고 조용해 보입니다. 이번에는 틀림없이 평화롭게 건널 수 있을 거예요.
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401285
    m_Localized: 졸렬한 다리
    m_Metadata:
      m_Items: []
  - m_Id: 5409240946401286
    m_Localized: 겉보기엔 평범해 보이는 다리지만, 이름은 위협적입니다. 무슨 문제라도 생길까요?
    m_Metadata:
      m_Items: []
  - m_Id: 195993120258600960
    m_Localized: 달빛
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738304
    m_Localized: 달빛 프롤로그
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738305
    m_Localized: 달빛 비치는 바다 밑에 무언가가 기다리고 있습니다...
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738306
    m_Localized: 달빛에 비친 미스터리
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738307
    m_Localized: 침몰된 방
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738308
    m_Localized: 파도 아래에 있는 것이 무엇일까요... 단순한 NPC와의 만남일까요, 아니면 나중에 드러날 콘텐츠를 성급하게 미리 보여주는 것일까요?
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738309
    m_Localized: 썰물 아래에서 이방인 하나가 가장 용감한 크롤러를 기다립니다.   흠뻑 젖을 것 같으니 수건 꼭 챙겨오세요.
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738310
    m_Localized: 달빛
    m_Metadata:
      m_Items: []
  - m_Id: 195993120304738311
    m_Localized: 보름달 아래 바다에 매몰된 도시 전설이 구전으로 전해집니다. 밝혀지지 않은 미스터리의 본거지죠. 무엇이 있는지 살펴봐야 해요.
    m_Metadata:
      m_Items: []
