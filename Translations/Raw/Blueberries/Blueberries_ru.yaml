  - m_Id: 2284044935168
    m_Localized: Ля Робба
    m_Metadata:
      m_Items: []
  - m_Id: 2284095266816
    m_Localized: Бросает мебель.
    m_Metadata:
      m_Items: []
  - m_Id: 2188433052086272
    m_Localized: Бродяга-симпатяга
    m_Metadata:
      m_Items: []
  - m_Id: 2188433089835008
    m_Localized: Карты бродяг получают дополнительный случайный цветной триггер при разыгрывании.
    m_Metadata:
      m_Items: []
  - m_Id: 2188433089835009
    m_Localized: Карты бродяг получают дополнительный случайный цветной триггер при разыгрывании.
    m_Metadata:
      m_Items: []
  - m_Id: 4416592655011840
    m_Localized: Бесконечное комбо
    m_Metadata:
      m_Items: []
  - m_Id: 4416592684371968
    m_Localized: Вытяните новую руку, когда ваша последняя карта продолжает комбо.
    m_Metadata:
      m_Items: []
  - m_Id: 4416592684371969
    m_Localized: Вытяните новую руку, когда ваша последняя карта продолжает комбо.
    m_Metadata:
      m_Items: []
  - m_Id: 5085614268473344
    m_Localized: Сбросьте {Count:p:1 карту|{:N0} карты|{:N0} карт} из руки
    m_Metadata:
      m_Items:
      - rid: 193345922286223367
  - m_Id: 5424281531043840
    m_Localized: '{:color(Keyword):Переброска}'
    m_Metadata:
      m_Items:
      - rid: 193345922286223367
  - m_Id: 5424281531043841
    m_Localized: Сбросьте {ActionValue:p:1 случайную карту|{:N0} случайные карты|{:N0} случайных карт} из руки, а затем вытяните {ActionValue:N0}.
    m_Metadata:
      m_Items:
      - rid: 193345922286223367
  - m_Id: 7251841128587264
    m_Localized: '{:color(Keyword):Приспособляемость}'
    m_Metadata:
      m_Items:
      - rid: 193345922286223367
  - m_Id: 7251841162141696
    m_Localized: Эта карта стоит столько, сколько нужно, чтобы продолжить комбо.
    m_Metadata:
      m_Items: []
  - m_Id: 7604875813707776
    m_Localized: Даёт этой карте «Приспособляемость».
    m_Metadata:
      m_Items: []
  - m_Id: 7634092110635008
    m_Localized: Ограничить размер руки
    m_Metadata:
      m_Items: []
  - m_Id: 7700284548571136
    m_Localized: '{effectString:disabled:}'
    m_Metadata:
      m_Items:
      - rid: 193345922286223367
  - m_Id: 7702454513688576
    m_Localized: '{:color(Keyword):Посмертие}'
    m_Metadata:
      m_Items:
      - rid: 193345922286223367
  - m_Id: 7702454547243008
    m_Localized: При сбросе разыграйте обычные эффекты этой карты.
    m_Metadata:
      m_Items: []
  - m_Id: 7963983708413952
    m_Localized: Эффекты карты разыгрываются при сбросе.
    m_Metadata:
      m_Items: []
  - m_Id: 7967692785967104
    m_Localized: Посмертие
    m_Metadata:
      m_Items: []
  - m_Id: 7967692815327232
    m_Localized: Приспособляемость
    m_Metadata:
      m_Items: []
  - m_Id: 8024049274839040
    m_Localized: Пробко
    m_Metadata:
      m_Items: []
  - m_Id: 8024049308393472
    m_Localized: Не даёт Утопцу появиться в бою.
    m_Metadata:
      m_Items: []
  - m_Id: 8024049308393473
    m_Localized: Задерживает появление Утопца в бою.
    m_Metadata:
      m_Items: []
  - m_Id: 9476304997965824
    m_Localized: '{:color(Keyword):Утилизация}'
    m_Metadata:
      m_Items:
      - rid: 193345922286223367
  - m_Id: 9476305031520256
    m_Localized: Получите 1 заряд «Утилизации» каждый раз, когда сбрасывается карта. Карты с «Утилизацией» выпускают дополнительные снаряды, число которых равно значению «Утилизации».
    m_Metadata:
      m_Items: []
  - m_Id: 9476305031520257
    m_Localized: Неземной разряд
    m_Metadata:
      m_Items: []
  - m_Id: 9476305031520258
    m_Localized: Критический удар может вызвать взрыв.
    m_Metadata:
      m_Items: []
  - m_Id: 9476305031520259
    m_Localized: Духовный порыв
    m_Metadata:
      m_Items: []
  - m_Id: 9476305031520260
    m_Localized: Улучшенный «Неземной разряд».
    m_Metadata:
      m_Items: []
  - m_Id: 9928406866014208
    m_Localized: Летающая бедренная кость
    m_Metadata:
      m_Items: []
  - m_Id: 9928406907957248
    m_Localized: Монета
    m_Metadata:
      m_Items: []
  - m_Id: 10178850515312640
    m_Localized: '{FccAction}, когда вытягивается карта {TriggerType.Icon}.'
    m_Metadata:
      m_Items:
      - rid: 193345922286223367
  - m_Id: 10178850624364544
    m_Localized: '{FccAction} при получении монеты {TriggerType.Icon}.'
    m_Metadata:
      m_Items:
      - rid: 193345922286223367
  - m_Id: 10178850624364545
    m_Localized: '{FccAction}, когда сбрасывается карта {TriggerType.Icon}.'
    m_Metadata:
      m_Items:
      - rid: 193345922286223367
  - m_Id: 10333246305808384
    m_Localized: Лунатьма
    m_Metadata:
      m_Items: []
  - m_Id: 10333246343557120
    m_Localized: В самых таинственных глубинах, где текут странные воды, промокшие до нитки искатели могут развести волны в тазике.
    m_Metadata:
      m_Items: []
  - m_Id: 10333246343557121
    m_Localized: 'На глубине, куда проникает ещё меньше лунного света, отчаявшиеся сборщики стекаются на всё, что только движется.  '
    m_Metadata:
      m_Items: []
  - m_Id: 10620020227825664
    m_Localized: '{:color(Keyword):Передача эффекта}'
    m_Metadata:
      m_Items:
      - rid: 193345922286223367
  - m_Id: 10620020278157312
    m_Localized: Даёт эффект «{CardEffect.KeywordName}» случайной карте {CardType.Icon}
    m_Metadata:
      m_Items:
      - rid: 193345922286223367
  - m_Id: 12369241960341504
    m_Localized: Карты бродяг получают дополнительный триггер случайного типа карты при разыгрывании.
    m_Metadata:
      m_Items: []
  - m_Id: 12369242002284544
    m_Localized: Карты бродяг получают дополнительный случайный триггер при разыгрывании.
    m_Metadata:
      m_Items: []
  - m_Id: 12369242002284545
    m_Localized: Ты? То есть... я!
    m_Metadata:
      m_Items: []
  - m_Id: 12369242002284546
    m_Localized: Я, я, я... Я тоже.
    m_Metadata:
      m_Items: []
  - m_Id: 12369242002284547
    m_Localized: Это что за чары морских глубин?
    m_Metadata:
      m_Items: []
