  - m_Id: 2284044935168
    m_Localized: 聖徒出奇蛋
    m_Metadata:
      m_Items: []
  - m_Id: 2284095266816
    m_Localized: 投擲家具。
    m_Metadata:
      m_Items: []
  - m_Id: 2188433052086272
    m_Localized: 僕從好夥伴
    m_Metadata:
      m_Items: []
  - m_Id: 2188433089835008
    m_Localized: 在打出僕從卡牌的時候，多獲得一種隨機的顏色觸發條件。
    m_Metadata:
      m_Items: []
  - m_Id: 2188433089835009
    m_Localized: 在打出僕從卡牌的時候，多獲得一種隨機的顏色觸發條件。
    m_Metadata:
      m_Items: []
  - m_Id: 4416592655011840
    m_Localized: 無限連段
    m_Metadata:
      m_Items: []
  - m_Id: 4416592684371968
    m_Localized: 如果你最後打出的卡牌有順利延續連段的話，抽取一整手全新的手牌。
    m_Metadata:
      m_Items: []
  - m_Id: 4416592684371969
    m_Localized: 如果你最後打出的卡牌有順利延續連段的話，抽取一整手全新的手牌。
    m_Metadata:
      m_Items: []
  - m_Id: 5085614268473344
    m_Localized: 從{GlobalKeywords.Hand}中棄掉 {Count:p:1 張手牌|{:N0} 張手牌}
    m_Metadata:
      m_Items:
      - rid: 193345922286223369
  - m_Id: 5424281531043840
    m_Localized: '{:color(Keyword):替換}'
    m_Metadata:
      m_Items:
      - rid: 193345922286223369
  - m_Id: 5424281531043841
    m_Localized: 從{GlobalKeywords.Hand}中隨機棄掉 {ActionValue:p:1 張手牌|{:N0} 張手牌}，然後抽取 {ActionValue:N0} 張卡牌。
    m_Metadata:
      m_Items:
      - rid: 193345922286223369
  - m_Id: 7251841128587264
    m_Localized: '{:color(Keyword):適應力}'
    m_Metadata:
      m_Items:
      - rid: 193345922286223369
  - m_Id: 7251841162141696
    m_Localized: 這張卡牌的法力消耗值永遠會是能夠藉以延續連段的法力消耗值。
    m_Metadata:
      m_Items: []
  - m_Id: 7604875813707776
    m_Localized: 賦予這張卡牌「適應力」的詞條。
    m_Metadata:
      m_Items: []
  - m_Id: 7634092110635008
    m_Localized: 限制手牌上限
    m_Metadata:
      m_Items: []
  - m_Id: 7700284548571136
    m_Localized: '{effectString:disabled:}'
    m_Metadata:
      m_Items:
      - rid: 193345922286223369
  - m_Id: 7702454513688576
    m_Localized: '{:color(Keyword):來生}'
    m_Metadata:
      m_Items:
      - rid: 193345922286223369
  - m_Id: 7702454547243008
    m_Localized: 棄掉這張手牌的話，其卡牌效果仍會照常發動。
    m_Metadata:
      m_Items: []
  - m_Id: 7963983708413952
    m_Localized: 棄牌後，仍可以發動卡牌的效果。
    m_Metadata:
      m_Items: []
  - m_Id: 7967692785967104
    m_Localized: 來生
    m_Metadata:
      m_Items: []
  - m_Id: 7967692815327232
    m_Localized: 適應力
    m_Metadata:
      m_Items: []
  - m_Id: 8024049274839040
    m_Localized: 塞子
    m_Metadata:
      m_Items: []
