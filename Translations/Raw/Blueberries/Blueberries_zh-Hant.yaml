      m_Items:
      - rid: 193345922286223369
  - m_Id: 9476305031520256
    m_Localized: 每當你棄掉 1 張手牌，便會獲得 1 層的「拾荒」層數。「拾荒」卡牌會發射出數量等同於你當前拾荒值的額外投射物。
