      m_Items:
      - rid: 193345922286223369
  - m_Id: 10333246305808384
    m_Localized: 滿月巔
    m_Metadata:
      m_Items: []
  - m_Id: 10333246343557120
    m_Localized: 既神祕又詭譎的水域正靜靜地等候冒險者的到來，渾身濕答答的冒險者們或許能夠在這裡掀起一陣波瀾也說不定。
    m_Metadata:
      m_Items: []
  - m_Id: 10333246343557121
    m_Localized: 再往深處，就是月光更難照亮的地方⋯即便只是一丁點的動靜，都有可能會引來飢不擇食的拾荒者⋯⋯
