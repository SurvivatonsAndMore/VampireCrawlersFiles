      m_Items: []
  - m_Id: 9476305031520257
    m_Localized: 異界之矢
    m_Metadata:
      m_Items: []
  - m_Id: 9476305031520258
    m_Localized: 暴擊有機會能夠引發爆炸。
    m_Metadata:
      m_Items: []
  - m_Id: 9476305031520259
    m_Localized: 靈魂湧動
    m_Metadata:
      m_Items: []
  - m_Id: 9476305031520260
