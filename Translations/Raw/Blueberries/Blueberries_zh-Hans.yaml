    m_Metadata:
      m_Items: []
  - m_Id: 2188433089835008
    m_Localized: 打出探索者卡牌时，其会额外获得一个随机颜色触发条件。
    m_Metadata:
      m_Items: []
  - m_Id: 2188433089835009
    m_Localized: 打出探索者卡牌时，其会额外获得一个随机颜色触发条件。
    m_Metadata:
      m_Items: []
  - m_Id: 4416592655011840
    m_Localized: 无尽连击
    m_Metadata:
      m_Items: []
  - m_Id: 4416592684371968
    m_Localized: 当你手中最后一张卡牌继续连击时，抽取一组新的手牌。
    m_Metadata:
      m_Items: []
  - m_Id: 4416592684371969
    m_Localized: 当你手中最后一张卡牌继续连击时，抽取一组新的手牌。
